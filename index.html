  :root{
    --navy:#1f2a8a; --navy2:#161d66; --ink:#1b1030; --yellow:#ffd23f; --orange:#f08a24;
    --red:#e2541b; --wine:#7a1f3d; --green:#3ddc84; --paper:#fffaf0;
    --h: 100vh;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--navy2);color:#fff;
    font-family:"Tiny5","Courier New",monospace;user-select:none;-webkit-user-select:none}
  body{background:
      radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
      radial-gradient(1px 1px at 72% 8%,#fff8 50%,transparent 51%),
      radial-gradient(1px 1px at 40% 60%,#fff6 50%,transparent 51%),
      radial-gradient(1px 1px at 88% 44%,#fff6 50%,transparent 51%),
      var(--navy2)}
  .pix{font-family:"Press Start 2P","Courier New",monospace;letter-spacing:.5px}

  #app{position:fixed;inset:0;height:var(--h);display:flex;flex-direction:column;max-width:520px;margin:0 auto}

  /* HUD */
  #hud{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;background:var(--navy2);border-bottom:3px solid var(--ink)}
  #hud .logo{font-size:12px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
  #hud .stat{display:flex;gap:10px;font-size:10px}
  #hud .chip{background:var(--ink);padding:6px 8px;border:2px solid #3a3f9a;color:var(--yellow)}
  #hud .chip.g{color:#fff}

  /* SCENE */
  #sceneWrap{flex:none;position:relative;margin:0 auto;overflow:hidden}
  #scene{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #bubble{position:absolute;left:34%;right:3%;top:2.5%;background:var(--paper);color:var(--ink);
    border:3px solid var(--ink);padding:8px 11px 9px;font-size:16px;line-height:1.28;
    box-shadow:4px 4px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(-6px) scale(.97);
    transition:opacity .18s, transform .18s;pointer-events:auto;min-height:44px}
  #bubble.show{opacity:1;transform:none}
  #bubble .who{display:block;font-family:"Press Start 2P",monospace;font-size:9px;color:var(--orange);margin-bottom:5px}
  #bubble:after,#bubble:before{content:"";position:absolute;top:100%;left:var(--tail,55%);border:solid transparent}
  #bubble:before{border-width:12px 10px 0 0;border-top-color:var(--ink);margin-left:-3px}
  #bubble:after{border-width:7px 6px 0 0;border-top-color:var(--paper);margin-left:0px;margin-top:-1px}
  #bubble.thought{background:#e9ecff}
  #bubble.thought:after{border-top-color:#e9ecff}

  #bubble{z-index:2}
  /* PANEL */
  #panel{flex:1;min-height:0;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
    background:#141a5c;border-top:3px solid var(--ink)}
  .ctx{font-size:16px;line-height:1.25;color:#cfd6ff;background:#0f1448;border:2px dashed #3a44a8;
    padding:7px 10px;margin-bottom:10px}
  .ctx b{color:var(--yellow);font-weight:600}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin-bottom:9px;
    background:var(--yellow);color:var(--ink);border:3px solid var(--ink);padding:9px 10px;
    font:17px/1.25 "Tiny5",monospace;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
    transform:translateY(8px);opacity:0;animation:pop .25s forwards}
  .opt:active{transform:translate(3px,3px)!important;box-shadow:1px 1px 0 var(--ink)}
  .opt .k{flex:none;width:22px;height:22px;background:#5b8cff;color:var(--ink);display:grid;place-items:center;
    font:10px "Press Start 2P",monospace;border:2px solid var(--ink)}
  @keyframes pop{to{transform:none;opacity:1}}

<script>
/* ==================== TELEGRAM ==================== */
const tg = window.Telegram && window.Telegram.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor('#161d66'); tg.setBackgroundColor('#161d66'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
function haptic(kind){ try{ tg.HapticFeedback.notificationOccurred(kind); }catch(e){} }
function tap(){ try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} }

/* ==================== PIXEL HELPERS ==================== */
const W = 120, H = 150, OUT = '#1b1030';
let C; // current 2d context
function R(x,y,w,h,c){ C.fillStyle=c; C.fillRect(Math.round(x),Math.round(y),w,h); }
function blob(x,y,w,h,c){ // rounded box with 1px dark outline
  R(x+1,y,w-2,h,OUT); R(x,y+1,w,h-2,OUT); R(x+1,y+1,w-2,h-2,c);
}
function shade(hex,f){ // f<1 darker, f>1 lighter
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<1?v*f:v+(255-v)*(f-1))));
  return '#'+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1);
}
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

const SKIN = {light:'#ffdcc0', fair:'#f5c49b', tan:'#dca274', olive:'#c48858', brown:'#94603d', dark:'#5f3b27'};

/* ==================== CHARACTER ==================== */
// Chibi guest, 24px wide. (ox,oy) = top-left of head.
function drawGuest(g, ox, oy, mood, t){
  const P=(x,y,w,h,c)=>R(ox+x,oy+y,w,h,c);
  const B=(x,y,w,h,c)=>blob(ox+x,oy+y,w,h,c);
  const sk=g.skin, hc=g.hair, hd=shade(hc,.72), top=g.top, ts=shade(top,.75), t2=g.top2||'#ffffff';
  const has=a=>g.acc&&g.acc.includes(a);

  // ---- back layers
  if(has('backpack')) B(0,20,24,14,g.bag||'#3a3a4a');
  if(g.hs==='long') { B(1,3,22,26,hc); }
  if(g.hs==='bob') { B(1,3,22,17,hc); }
  if(g.hs==='ponytail'){ B(19,3,6,17,hc); P(20,6,1,10,hd); }
  if(g.hs==='hijab'){ B(0,0,24,28,g.hij); }

  // ---- body
  B(1,20,6,13,top); B(17,20,6,13,top);           // arms
  B(5,18,14,18,top);                             // torso
  P(10,18,4,2,shade(sk,.82));                    // neck
  const st=g.style;
  if(st==='hoodie'){ P(6,18,12,3,ts); P(10,21,1,4,'#fff'); P(13,21,1,4,'#fff'); P(8,28,8,4,ts); P(8,28,8,1,OUT); }
  if(st==='coat'){ P(8,19,3,8,ts); P(13,19,3,8,ts); P(11,19,2,5,t2); P(11,28,1,1,OUT); P(11,31,1,1,OUT); P(1,24,6,1,ts); P(17,24,6,1,ts);}
  if(st==='suit'){ P(10,19,4,7,'#ffffff'); P(11,20,2,8,t2); P(11,20,2,1,shade(t2,.7)); P(8,19,2,9,ts); P(14,19,2,9,ts); P(15,24,3,1,'#fff'); }
  if(st==='tshirt'){ P(2,26,4,6,sk); P(18,26,4,6,sk); P(1,25,6,1,OUT); P(17,25,6,1,OUT); P(8,23,8,6,t2); P(9,24,2,2,top); P(13,25,2,2,top); }
  if(st==='sport'){ P(12,19,1,16,'#e8e8e8'); P(9,18,6,2,t2); P(2,22,1,9,t2); P(21,22,1,9,t2); P(6,22,2,1,t2); }
  if(st==='sweater'){ P(5,24,14,2,t2); for(let i=6;i<18;i+=3)P(i,27,1,1,t2); P(9,18,6,2,ts); P(1,30,6,2,ts); P(17,30,6,2,ts); }
  if(st==='dress'){ P(9,19,6,2,'#ffffff'); P(5,28,14,1,t2); P(11,22,2,2,t2); }
  if(st==='leather'){ P(7,18,4,4,ts); P(13,18,4,4,ts); P(11,19,2,3,t2); P(12,22,1,13,'#9a9aa6'); P(6,28,3,1,'#9a9aa6'); }
  if(st==='flannel'){ for(let y=19;y<35;y+=4)P(5,y,14,1,ts); for(let x=7;x<18;x+=4)P(x,19,1,16,ts); P(10,19,4,4,t2); for(let y=22;y<32;y+=4){P(1,y,6,1,ts);P(17,y,6,1,ts);} }
  if(st==='apron'){ P(7,20,10,15,t2); P(7,20,10,1,shade(t2,.8)); P(8,18,1,2,t2); P(15,18,1,2,t2); P(9,28,6,3,shade(t2,.85)); P(1,24,6,1,ts); P(17,24,6,1,ts); }
  if(st==='puffer'){ for(let y=22;y<35;y+=4)P(5,y,14,1,ts); for(let y=23;y<32;y+=4){P(1,y,6,1,ts);P(17,y,6,1,ts);} P(12,19,1,16,ts); P(7,17,10,3,ts); }
  if(has('scarf')){ B(5,16,14,5,g.scarf); P(14,20,3,7,g.scarf); P(14,23,3,1,shade(g.scarf,.7)); }
  if(has('backpack')){ P(7,19,2,15,shade(g.bag||'#3a3a4a',.9)); P(15,19,2,15,shade(g.bag||'#3a3a4a',.9)); }
  B(1,31,6,4,sk); B(17,31,6,4,sk);               // hands
  if(has('phone')){ B(17,27,5,8,'#222'); P(18,28,3,5,'#7fd0ff'); }

  // ---- head
  B(0,8,3,5,sk); B(21,8,3,5,sk);                 // ears
  B(2,0,20,19,sk);
  P(3,17,18,1,shade(sk,.88));

  // ---- face
  face(P, mood, sk, g);

  // ---- front hair / hats
  const hs=g.hs;
  const shortTop=()=>{ P(3,1,18,5,hc); P(3,1,18,1,shade(hc,1.25)); P(3,6,2,4,hc); P(19,6,2,4,hc); P(6,6,4,1,hc); P(13,6,3,1,hc); };
  if(hs==='short'||hs==='long'||hs==='bob'||hs==='ponytail'||hs==='bun'){ shortTop(); }
  if(hs==='long'){ P(3,6,3,11,hc); P(18,6,3,11,hc); P(4,6,1,9,hd); }
  if(hs==='bob'){ P(3,6,2,10,hc); P(19,6,2,10,hc); P(3,1,8,6,hc); }
  if(hs==='bun'){ B(8,-5,8,6,hc); P(10,-4,3,1,shade(hc,1.25)); }
  if(hs==='buzz'){ P(3,1,18,4,hc); for(let i=4;i<20;i+=2)P(i,2,1,1,hd); P(3,5,1,3,hc); P(20,5,1,3,hc); }
  if(hs==='curly'){ for(let i=0;i<6;i++) B(i*4-1,-3+(i%2),7,7,hc); B(0,2,5,10,hc); B(19,2,5,10,hc); P(4,3,16,3,hc); for(let i=2;i<22;i+=3)P(i,-1+(i%2),1,1,shade(hc,1.3)); }
  if(hs==='bald'){ P(2,6,2,5,hc); P(20,6,2,5,hc); P(13,2,4,1,'#ffffff88'); }
  if(hs==='cap'){ const c=g.hat; B(2,-2,20,8,c); P(4,-1,8,1,shade(c,1.25)); P(1,5,22,2,shade(c,.7)); P(11,1,3,2,g.hat2||'#fff'); P(3,7,2,3,hc); P(19,7,2,3,hc); }
  if(hs==='flatcap'){ const c=g.hat; B(1,-1,22,7,c); P(1,5,22,2,shade(c,.75)); for(let i=3;i<21;i+=3)P(i,1,1,1,shade(c,.8)); P(2,7,2,4,hc); P(20,7,2,4,hc); }
  if(hs==='beanie'){ const c=g.hat; B(2,-4,20,10,c); P(2,3,20,3,shade(c,.78)); for(let i=4;i<20;i+=2)P(i,-2,1,4,shade(c,.88)); B(9,-8,6,5,g.hat2||'#ffffff'); P(3,7,2,3,hc); P(19,7,2,3,hc); }
  if(hs==='hijab'){ const c=g.hij, cd=shade(c,.78); P(2,0,20,6,c); P(2,0,4,19,c); P(18,0,4,19,c); P(2,16,20,5,c); P(5,5,1,12,cd); P(18,5,1,12,cd); P(4,1,10,1,shade(c,1.2)); P(2,0,20,1,OUT); }

  // ---- accessories on face
  if(has('glasses')){ const f=g.frame||OUT; P(4,8,7,1,f);P(4,13,7,1,f);P(4,8,1,6,f);P(10,8,1,6,f); P(13,8,7,1,f);P(13,13,7,1,f);P(13,8,1,6,f);P(19,8,1,6,f); P(11,10,2,1,f); P(5,9,2,1,'#ffffff99'); P(14,9,2,1,'#ffffff99'); }
  if(has('shades')){ P(4,8,7,5,'#111');P(13,8,7,5,'#111');P(11,9,2,1,'#111'); P(5,9,2,1,'#5a6cff'); P(14,9,2,1,'#5a6cff'); }
  if(has('headphones')){ const c=g.hp||'#222'; P(2,-2,20,2,c); P(1,-1,2,7,c); P(21,-1,2,7,c); B(-1,6,4,8,c); B(21,6,4,8,c); }
  if(has('earrings')){ P(1,13,1,2,'#ffd23f'); P(22,13,1,2,'#ffd23f'); }
}

function face(P, mood, sk, g){
  const E=g.eye||OUT, mouth='#8c2f3a', blush='#ff8f9a';
  const has=a=>g.acc&&g.acc.includes(a);
  // eyes
  if(mood==='happy'){
    P(5,11,1,1,E);P(6,10,2,1,E);P(8,11,1,1,E);  P(15,11,1,1,E);P(16,10,2,1,E);P(18,11,1,1,E);
  } else if(mood==='surprised'){
    P(6,8,3,4,E); P(15,8,3,4,E); P(6,8,1,1,'#fff'); P(15,8,1,1,'#fff');
  } else if(mood==='angry'){
    P(6,10,3,2,E); P(15,10,3,2,E);
    P(5,7,2,1,E);P(7,8,2,1,E);  P(15,8,2,1,E);P(17,7,2,1,E);
  } else if(mood==='sad'){
    P(6,10,3,2,E); P(15,10,3,2,E);
    P(5,8,2,1,E);P(7,7,2,1,E);  P(15,7,2,1,E);P(17,8,2,1,E);
    P(6,12,1,2,'#6ec6ff');
  } else { // neutral
    P(6,9,3,3,E); P(15,9,3,3,E); P(6,9,1,1,'#fff'); P(15,9,1,1,'#fff');
  }
  if(g.freckles){ P(5,13,1,1,'#c0703a');P(7,14,1,1,'#c0703a');P(16,14,1,1,'#c0703a');P(18,13,1,1,'#c0703a'); }
  if(g.rednose){ P(10,12,4,2,'#e8737a'); P(5,13,3,1,'#f08f8f'); P(16,13,3,1,'#f08f8f'); }
  // beard under mouth
  if(has('beard')){ const b=g.hair; P(3,12,3,6,b); P(18,12,3,6,b); P(5,15,14,4,b); P(8,13,8,1,b); }
  if(has('stubble')){ for(let x=5;x<19;x+=2)for(let y=14;y<18;y+=2)P(x+(y%4?1:0),y,1,1,'#00000033'); }
  if(has('moustache')){ P(8,13,8,2,g.hair); P(7,14,1,1,g.hair); P(16,14,1,1,g.hair); }
  // blush
  if(mood==='happy'||g.kid) { P(4,13,2,1,blush); P(18,13,2,1,blush); }
  // mouth
  if(mood==='happy'){ P(9,14,6,1,OUT); P(10,15,4,1,'#d0404e'); P(9,14,1,1,OUT); }
  else if(mood==='angry'){ P(10,15,4,1,OUT); P(9,16,1,1,OUT); P(14,16,1,1,OUT); }
  else if(mood==='sad'){ P(10,15,4,1,OUT); P(9,16,1,1,OUT); P(14,16,1,1,OUT); }
  else if(mood==='surprised'){ P(11,14,2,3,mouth); }
  else { P(10,15,4,1,mouth); }
}

function angryTint(ox,oy){ C.fillStyle='rgba(255,50,50,.14)'; C.fillRect(ox+3,oy+1,18,17); }

/* ==================== SCENE ART ==================== */
const bg = document.createElement('canvas'); bg.width=W; bg.height=H;
const fg = document.createElement('canvas'); fg.width=W; fg.height=H;
const GY = 64; // guest head top (guest stands behind the pickup counter, right side)
const GX = 90; // where the guest stops
// Pickup counter (right of the coffee machine): 5 back + 5 front cells, top view
const CELLS=[
  {x:68,y:103,w:8,h:7},{x:78,y:103,w:8,h:7},{x:88,y:103,w:8,h:7},{x:98,y:103,w:8,h:7},{x:108,y:103,w:8,h:7},
  {x:64,y:115,w:9,h:11},{x:75,y:115,w:9,h:11},{x:86,y:115,w:9,h:11},{x:97,y:115,w:9,h:11},{x:108,y:115,w:9,h:11}
];
let cups=[0,1,0,0,1,0,0,1,0,0]; const CUPS0=cups.slice();

function paintFG(){
  C=fg.getContext('2d'); C.clearRect(0,0,W,H);
  // ===== barista back counter (bottom strip)
  R(0,146,W,4,'#a9aeb6'); R(0,146,W,1,'#c9ccd2');

  // ===== PICKUP COUNTER (white slab, black glass cells with blue neon)
  for(let y=100;y<131;y++){ const k=(y-100)/30, L=Math.round(66-4*k), Rr=Math.round(118+2*k);
    R(L,y,Rr-L,1, y<102?'#ffffff':'#eef0f3'); }
  R(66,99,52,1,'#9aa0aa'); R(62,131,W-62,2,'#ffffff'); R(62,133,W-62,1,'#b9bec7');
  R(62,134,W-62,12,'#e9ecf0'); for(let x=66;x<W;x+=14) R(x,134,1,12,'#dde1e7');   // front panel (barista side)
  CELLS.forEach((c,i)=>{
    const {x,y,w,h}=c;
    R(x+1,y-1,w-2,1,'#2d5bff'); R(x+1,y+h,w-2,1,'#2d5bff'); R(x-1,y+1,1,h-2,'#2d5bff'); R(x+w,y+1,1,h-2,'#2d5bff'); // neon (rounded)
    R(x,y,w,1,'#7aa0ff'); R(x,y+h-1,w,1,'#7aa0ff'); R(x,y,1,h,'#7aa0ff'); R(x+w-1,y,1,h,'#7aa0ff');
    R(x+1,y+1,w-2,h-2,'#0c0e14');
    R(x+w-5,y+1,3,2,'#58c8ff'); R(x+w-4,y+1,1,1,'#ffffff');                       // order number display
    R(x+1,y+h-3,1,1,'#2a3040');
    if(cups[i]) drawCup(x+(w>>1)-2, y+h-(i<5?8:9), i, i<5);
  });

  // ===== ESPRESSO MACHINE (white + chrome, 3 groups) on the left
  const mx=0, mw=62, my=113;
  R(mx+2,my-2,mw-4,2,'#d9dce2'); R(mx+3,my-2,mw-6,1,'#f4f5f7');                    // cup warmer
  R(mx,my,mw,8,OUT); R(mx+1,my+1,mw-2,6,'#f4f5f7'); R(mx+1,my+1,mw-2,1,'#ffffff');  // white top frame
  R(mx+2,my+2,4,4,OUT); R(mx+3,my+3,2,2,'#3a3d44'); R(mx+mw-6,my+2,4,4,OUT); R(mx+mw-5,my+3,2,2,'#3a3d44');
  R(mx+8,my+2,mw-16,4,'#121318');
  [10,12,14, 18,20,22,24, 30,32,34,36, 40,42].forEach(x=>R(mx+x,my+3,1,2,'#c9ccd3'));
  R(mx+mw-14,my+2,5,4,'#121318'); R(mx+mw-13,my+3,3,2,'#a9d8ff');
  // chrome body

// Tablet with the order tracker (like the real one: browser bar, 3×2 grid of order cards, footer)
function drawTablet(){
  const x=19, y=93, w=24, h=15;
  R(x,y,w,h,OUT); R(x+1,y+1,w-2,h-2,'#15161a');
  R(x+1,y+1,w-2,1,'#dfe6f2'); R(x+5,y+1,10,1,'#b9c4d8');                    // browser bar
  R(x+1,y+2,w-2,h-3,'#1b2540');                                            // dark tracker bg
  const cw=6, ch=4;
  for(let r=0;r<2;r++) for(let c=0;c<3;c++){
    const cx=x+2+c*(cw+1), cy=y+3+r*(ch+1), i=r*3+c;
    const o = i===0?curOrder : i===1?prevOrder : null;
    if(o && !o.empty){

  }

/* ==================== ORDER TRACKER TABLET ==================== */
const DRINK={taste:'Капучино',slow:'Раф ванильный',ownmilk:'Капучино',tonic:'Эспрессо-тоник',pitcher:'Флэт уайт',kid:'—',
  wrong:'Раф',allergy:'Латте',kolobok:'Флэт уайт',dislike:'Латте карамель',drunk:'Американо',aggr:'—',afterclose:'—',table:'—',burn:'Американо',neighbors:'—',milk:'Капучино',spoons:'Йогурт',soldout:'Капучино',prayer:'Чай',rude:'Панини',sauce:'Латте карамель',change:'Капучино',teens:'Какао ×4'};
const WAITED={slow:880};
let orderNo=1, prevOrder=null, curOrder=null;
function newOrder(c){
  prevOrder=curOrder;
  curOrder={no:'16-'+(orderNo++), name:c.g.kid?'—':c.g.name, drink:DRINK[c.id]||'Латте', t0:Date.now()-((WAITED[c.id]||40+Math.random()*60)*1000), done:false, empty:c.g.kid||DRINK[c.id]==='—'};
}
function orderDone(){ if(curOrder&&!curOrder.done){ curOrder.done=true; curOrder.t1=Date.now(); } }

/* ==================== GAME STATE ==================== */
const SHIFT = 6;
const cv=document.getElementById('scene'), sctx=cv.getContext('2d');
const wrap=document.getElementById('sceneWrap'), panel=document.getElementById('panel');
const bubble=document.getElementById('bubble'), sayEl=document.getElementById('say'), whoEl=document.getElementById('who');
let game=null, guest=null, typer=null, fx=[], seen=new Set();

function pickShift(){
  let pool=CASES.map((c,i)=>i).filter(i=>!seen.has(i));
  if(pool.length<SHIFT){ seen.clear(); pool=CASES.map((c,i)=>i); }
  pool.sort(()=>Math.random()-.5);
  const q=pool.slice(0,SHIFT); q.forEach(i=>seen.add(i)); return q;
}
function startShift(){
  game={q:pickShift(), i:0, score:0, max:0, log:[]}; curOrder=null; prevOrder=null;
  cups=CUPS0.slice(); paintFG();
  document.getElementById('titleOv').classList.add('hide');
  document.getElementById('endOv').classList.add('hide');
  hud(); nextGuest();
}
function hud(){
  document.getElementById('hudGuest').textContent=Math.min(game.i+1,SHIFT)+'/'+SHIFT;
  document.getElementById('hudScore').textContent='★ '+game.score;
}
function nextGuest(){
  const c=CASES[game.q[game.i]];
  guest={c, x:150, tx:c.g.kid?92:GX, mood:'neutral', state:'enter', step:0, walk:0, lastS:2};
  newOrder(c);
  hideBubble(); panel.innerHTML='<div class="wait">Гость подходит к выдаче…</div>';
  hud();
}
function showStep(k){
  const st=guest.c.steps[k]; guest.step=k; guest.state='talk';
  if(st.mood) guest.mood=st.mood;
  panel.innerHTML = st.ctx ? '<div class="ctx">'+st.ctx+'</div>' : '';
  typeBubble(guest.c.g.name, st.say, ()=>renderOptions(st));
}
function renderOptions(st){
  const opts=st.o.map((o,i)=>({...o,i})).sort(()=>Math.random()-.5);
  const box=document.createElement('div');
  opts.forEach((o,n)=>{
    const b=document.createElement('button'); b.className='opt'; b.style.animationDelay=(n*70)+'ms';
    b.innerHTML='<span class="k">'+'ABC'[n]+'</span><span>'+o.t+'</span>';
    b.onclick=()=>choose(st,o); box.appendChild(b);
  });
  panel.appendChild(box);
}
function choose(st,o){
  tap();
  game.score+=o.s; game.max+=2; guest.lastS=o.s; hud();
  const best=st.o.find(x=>x.s===2);
  game.log.push({title:guest.c.title, name:guest.c.g.name, pick:o.t, s:o.s, best:best.t, fb:o.fb});
  guest.mood=o.m; guest.react=0;
  haptic(o.s===2?'success':o.s===1?'warning':'error');
  const hy=guest.c.g.kid?110:GY;
  if(o.s===2){ spawn('star',guest.x,hy-6); const free=cups.findIndex(v=>!v); if(free>=0){cups[free]=1; paintFG();} }
  if(o.m==='happy') for(let i=0;i<3;i++) spawn('heart',guest.x-8+i*8,hy-i*3);
  if(o.m==='angry') for(let i=0;i<3;i++) spawn('steam',guest.x+(i-1)*9,hy-2);
  if(o.m==='sad') spawn('rain',guest.x,hy-4);
  if(o.m==='surprised') spawn('bang',guest.x+12,hy-6);
  typeBubble(guest.c.g.name, o.r);
  const verdict = o.s===2?'✔ ПО СТАНДАРТУ':o.s===1?'~ ЧАСТИЧНО':'✖ ОШИБКА';
  const pts = '+'+o.s+'★';
  let html='<div class="fb s'+o.s+'"><div class="v">'+verdict+' <span style="margin-left:auto">'+pts+'</span></div><p>'+o.fb+'</p>';
  if(o.s<2) html+='<div class="right"><b>Как по стандарту:</b> '+best.t+'</div>';
  html+='</div>';
  const isLast = o.next==null;
  html+='<button class="btn next" id="nextBtn"><span class="tri"></span>'+(isLast?'ДАЛЬШЕ':'ПРОДОЛЖИТЬ')+'</button>';
  panel.innerHTML=html; panel.scrollTop=0;
  document.getElementById('nextBtn').onclick=()=>{ tap(); if(!isLast){ guest.mood=o.m==='angry'?'angry':'neutral'; showStep(o.next);} else leave(); };
}
function leave(){
  if(guest.lastS>=1) orderDone();
  hideBubble();
  guest.state='leave';
  const good = guest.lastS>=1 && guest.mood!=='angry';
  guest.tx = good ? -30 : 150;
  panel.innerHTML='<div class="wait">'+(good?'Гость уходит довольным…':'Гость уходит…')+'</div>';
}

/* ==================== BUBBLE ==================== */
function typeBubble(name, text, done){
  clearInterval(typer);
  whoEl.textContent=name; sayEl.textContent='';
  bubble.classList.add('show');
  bubble.style.setProperty('--tail', Math.round(((guest.x/W)-.34)/.63*100-3)+'%');
  let i=0;
  const finish=()=>{ clearInterval(typer); typer=null; sayEl.textContent=text; bubble.onclick=null; done&&done(); };
  bubble.onclick=finish;
  typer=setInterval(()=>{ i+=1; sayEl.textContent=text.slice(0,i); if(i>=text.length) finish(); },22);
}
function hideBubble(){ clearInterval(typer); bubble.classList.remove('show'); }

/* ==================== FX ==================== */
function spawn(type,x,y){ fx.push({type,x,y,t:0}); }
function drawFX(dt){
  fx=fx.filter(f=>f.t<1.6);
  fx.forEach(f=>{ f.t+=dt; const k=f.t;
    if(f.type==='heart'){ const y=f.y-k*14, x=f.x+Math.sin(k*6)*2; if(k<1.4){ R(x,y,2,2,'#ff4d6d');R(x+3,y,2,2,'#ff4d6d');R(x-1,y+1,7,2,'#ff4d6d');R(x,y+3,5,1,'#ff4d6d');R(x+1,y+4,3,1,'#ff4d6d');R(x+2,y+5,1,1,'#ff4d6d');R(x,y+1,1,1,'#fff'); } }
    if(f.type==='steam'){ const y=f.y-k*10; const s=2+k*3|0; if(k<1.3){ R(f.x-s/2,y,s,s,'#ffffffcc'); R(f.x-s/2+1,y-1,s-1,1,'#ffffff88'); } }
    if(f.type==='star'){ if(k<1.2){ const y=f.y-k*6; R(f.x-1,y-4,3,9,'#ffd23f'); R(f.x-4,y-1,9,3,'#ffd23f'); R(f.x,y-1,1,3,'#fff'); } }
    if(f.type==='rain'){ for(let i=0;i<3;i++){ const yy=f.y+((k*30+i*5)%14); R(f.x-6+i*6,yy,1,3,'#6ec6ff'); } }
    if(f.type==='bang'){ if(k<1.4){ R(f.x,f.y,2,6,'#ffd23f'); R(f.x,f.y+8,2,2,'#ffd23f'); R(f.x-1,f.y-1,4,1,OUT); } }
  });
}

/* ==================== RENDER LOOP ==================== */
let last=performance.now(), T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  C=sctx; C.clearRect(0,0,W,H);
  C.drawImage(bg,0,0);
  if(guest){
    const g=guest.c.g; const d=guest.tx-guest.x;
    let moving=Math.abs(d)>.6;
    if(moving){ const sp=(guest.state==='leave'&&guest.mood==='angry')?70:46; guest.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt); guest.walk+=dt*10; }
    else if(guest.state==='enter'){ guest.x=guest.tx; showStep(0); }
    else if(guest.state==='leave'){ guest.state='gone'; setTimeout(()=>{ game.i++; if(game.i>=SHIFT) endShift(); else nextGuest(); }, 250); }
    const bob = moving ? (Math.sin(guest.walk)>0?-1:0) : (Math.sin(T*2.2)>.6?-1:0);
    const hop = (guest.mood==='happy' && !moving && guest.state!=='leave') ? (Math.sin(T*7)>.7?-1:0) : 0;
    const shake = (guest.mood==='angry' && !moving) ? (Math.sin(T*30)>0?1:0) : 0;
    // crowd behind (teens)
    if(g.crowd){ g.crowd.forEach((cg,i)=>{ const cx=guest.x+(i?24:-24), oy=GY-3+(i?1:0); drawTinted(cg, cx-12, oy+bob, guest.mood==='angry'?'angry':guest.mood==='happy'?'happy':'neutral'); }); }
    const ox=Math.round(guest.x-12)+shake, oy=(g.kid?110:GY)+bob+hop;
    if(g.kid){ C.drawImage(fg,0,0); drawTablet(); }           // ребёнок зашёл за бар — он перед нами, на нашей стороне
    drawGuest(g, ox, oy, guest.mood, T);
    if(guest.mood==='angry') angryTint(ox,oy);
    if(!g.kid){ C.drawImage(fg,0,0); drawTablet(); }
    drawFX(dt);
  } else { C.drawImage(fg,0,0); drawTablet(); }
  requestAnimationFrame(frame);
}
const tint=document.createElement('canvas'); tint.width=30; tint.height=50;
function drawTinted(g,ox,oy,mood){
  const prev=C, tc=tint.getContext('2d'); tc.clearRect(0,0,30,50); C=tc;
  drawGuest(g,3,8,mood,T);
  tc.globalCompositeOperation='source-atop'; tc.fillStyle='rgba(20,26,92,.38)'; tc.fillRect(0,0,30,50); tc.globalCompositeOperation='source-over';
  C=prev; C.drawImage(tint,ox-3,oy-8);
}

/* ==================== LAYOUT ==================== */
function layout(){
  const vh = (tg && tg.viewportStableHeight) ? Math.max(tg.viewportStableHeight, 300) : window.innerHeight;
  document.documentElement.style.setProperty('--h', vh+'px');
  const vw = Math.min(window.innerWidth, 520);
  const avail = vh - 44 - 215; // keep room for answers
  const s = Math.max(1.6, Math.min(vw/W, avail/H));
  wrap.style.width = Math.round(W*s)+'px'; wrap.style.height = Math.round(H*s)+'px';
  const fs = Math.max(15, Math.min(19, s*5.6));
  bubble.style.fontSize = fs+'px';
  wrap.style.setProperty('--s', s);
}
window.addEventListener('resize', layout);
try{ tg.onEvent('viewportChanged', layout); }catch(e){}

/* ==================== TITLE / END ==================== */
function starfield(id){
  const c=document.getElementById(id); const w=c.clientWidth||360, h=c.clientHeight||700;
  c.width=Math.round(w/3); c.height=Math.round(h/3); c.style.imageRendering='pixelated';
  const x=c.getContext('2d'); x.fillStyle='#1f2a8a'; x.fillRect(0,0,c.width,c.height); const r=rng(3);
  for(let i=0;i<70;i++){ const sx=r()*c.width|0, sy=r()*c.height|0; x.fillStyle=r()<.5?'#ffffffcc':'#9fb0ff'; x.fillRect(sx,sy,1,1);
    if(r()<.1){ x.fillRect(sx-1,sy,3,1); x.fillRect(sx,sy-1,1,3);} }
}
function paintTitle(){
  const c=document.getElementById('titleCanvas'); C=c.getContext('2d'); C.clearRect(0,0,120,78);
  // ground
  R(0,70,120,8,'#46291a'); R(0,70,120,1,'#7a4a2a'); for(let i=0;i<120;i+=6)R(i,72,1,6,'#3a2214');
  // steps like on the banner
  const steps=[[6,58],[34,46],[62,34],[90,22]];
  steps.forEach(([x,y],i)=>{ R(x-1,y-1,28,71-y,OUT); R(x,y,26,70-y,'#5a3820'); R(x,y,26,3,'#ffd23f'); R(x,y+3,26,1,'#f08a24');
    for(let yy=y+7;yy<70;yy+=5) R(x,yy,26,1,'#4a2c18'); });
  // guests on steps
  const gs=[CASES[1].g, CASES[7].g, CASES[8].g];
  gs.forEach((g,i)=>{ const [x,y]=steps[i]; drawGuest(g, x+1, y-36, i===2?'happy':'neutral', 0); });
  // cup with steam on the top step
  const [cx,cy]=steps[3]; R(cx+6,cy-16,14,2,OUT); R(cx+7,cy-15,12,1,'#a8c8ff'); R(cx+7,cy-14,12,13,OUT); R(cx+8,cy-14,10,12,'#ffffff');
  R(cx+9,cy-10,8,5,'#2b39b0'); R(cx+11,cy-9,4,3,'#5b8cff');
  [0,5,10].forEach(o=>{ R(cx+8+o-2,cy-22,2,1,'#fff'); R(cx+8+o-1,cy-23,1,1,'#fff'); R(cx+8+o-1,cy-21,1,1,'#fff'); });
}
const RANKS=[[.9,'ЛЕГЕНДА СЕРВИСА','Гости уходят счастливыми. Можно учить других!'],[.75,'НАСТАВНИК','Отличная смена — пара деталей, и будет идеально.'],[.5,'БАРИСТА','Неплохо! Разбери ошибки ниже.'],[0,'СТАЖЁР','Есть над чем поработать — загляни в разбор и попробуй ещё.']];
function endShift(){
  hideBubble(); guest=null;
  const ov=document.getElementById('endOv'); ov.classList.remove('hide'); starfield('starsCanvas2');
  document.getElementById('endScore').textContent='★ '+game.score+' / '+game.max;
  const k=game.max?game.score/game.max:0; const rk=RANKS.find(r=>k>=r[0]);
  document.getElementById('endRank').innerHTML=rk[1]+'<div style="font-family:Tiny5,monospace;font-size:15px;color:#cfd6ff;margin-top:6px;line-height:1.3">'+rk[2]+'</div>';
  setTimeout(()=>document.getElementById('endBar').style.width=Math.round(k*100)+'%',60);
  const errs=game.log.filter(l=>l.s<2);
  document.getElementById('endReview').innerHTML = errs.length
    ? '<div class="pix" style="font-size:10px;color:#fff;margin-bottom:10px">РАЗБОР ОШИБОК</div>'+errs.map(e=>'<div class="rv"><h4>'+e.name.toUpperCase()+' · '+e.title+'</h4><div class="bad">Твой ответ: '+e.pick+'</div><div class="good">По стандарту: '+e.best+'</div></div>').join('')
    : '<div class="allgood">Все кейсы решены по стандарту. Так держать!</div>';
  haptic(k>=.75?'success':'warning');
}

/* ==================== BOOT ==================== */
paintBG(); paintFG(); layout(); starfield('starsCanvas');
const boot=()=>{ paintTitle(); };
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
boot();
document.getElementById('startBtn').onclick=()=>{ tap(); startShift(); };
document.getElementById('againBtn').onclick=()=>{ tap(); startShift(); };
requestAnimationFrame(frame);
</script>
